<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도시락 합치기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Physics merge puzzle: drop lunch foods into a wooden lunchbox; two of the same merge into the next food.
   Layout fits one phone screen: header, canvas (flex), evolution ladder. */
:root{
  --bg:#F6F1E7; --surface:#FFFDF8; --ink:#1F1B16; --muted:#7A6F62; --line:#E6DCCB;
  --accent:#E8892B; --accent-ink:#2A1505; --danger:#E0565B;
  --box:#C99A62; --box-in:#F3E3C6; --box-edge:#A87A45;
  --f-display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15130F; --surface:#1F1C17; --ink:#F3EDE2; --muted:#A79C8C; --line:#332E26;
  --accent:#F2A93B; --accent-ink:#2A1505; --danger:#FF7A7F;
  --box:#6E5233; --box-in:#2A241C; --box-edge:#8A6A44; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15130F; --surface:#1F1C17; --ink:#F3EDE2; --muted:#A79C8C; --line:#332E26;
  --accent:#F2A93B; --accent-ink:#2A1505; --danger:#FF7A7F;
  --box:#6E5233; --box-in:#2A241C; --box-edge:#8A6A44; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding-inline:12px;padding-block:8px 10px;display:flex;flex-direction:column;gap:8px;height:100%;min-height:540px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex:none}
.home{display:block;font-size:12px;font-weight:700;color:inherit;opacity:.6;text-decoration:none;margin-bottom:3px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1}
.date{font-size:12px;color:var(--muted);margin-top:3px}
.scores{display:flex;gap:6px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 10px;display:flex;flex-direction:column;align-items:flex-end;min-width:68px}
.sc small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.sc b{font-family:var(--f-display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stage{flex:1 1 0;min-height:0;position:relative;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ladder{flex:none;display:flex;align-items:center;justify-content:space-between;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 6px;overflow:hidden}
.ladder img{width:min(26px,6.4vw);height:auto}
.ladder span{display:flex;opacity:.28;transition:opacity .2s, transform .2s;line-height:1}
.ladder span.got{opacity:1}
.ladder span.pop{transform:scale(1.4)}
.ladder i{font-style:normal;font-size:10px;color:var(--muted)}
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;line-height:1.1}
.card p{margin:0;line-height:1.6;color:var(--muted)}
.big{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px;font:800 16px var(--f-body);cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:700 15px var(--f-body);cursor:pointer}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.evo{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <a class="home" href="https://jangwoo-kim.github.io/games/" target="_top">← 점오하게</a>
      <h1>도시락 합치기</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="scores">
      <div class="sc"><small>점수</small><b id="score">0</b></div>
      <div class="sc"><small>오늘 최고</small><b id="best">0</b></div>
    </div>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="ladder" id="ladder"></div>
</div>
<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>

<script src="../jo.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  // food ladder: small → big. Two of the same merge into the next one.
  const FOOD = [
    {e:'🥚', n:'계란',    c:'#FFF4D6', s:.50},
    {e:'🍙', n:'주먹밥',  c:'#F1F1EC', s:.64},
    {e:'🥟', n:'만두',    c:'#F6E7C9', s:.80},
    {e:'🍤', n:'새우튀김', c:'#FFD79A', s:.96},
    {e:'🍢', n:'어묵',    c:'#F2C08A', s:1.14},
    {e:'🍗', n:'치킨',    c:'#E8A766', s:1.34},
    {e:'🍔', n:'버거',    c:'#F4C36B', s:1.56},
    {e:'🍕', n:'피자',    c:'#FFB38A', s:1.80},
    {e:'🍜', n:'라면',    c:'#FF9F7A', s:2.06},
    {e:'🍱', n:'도시락',  c:'#9ED3A8', s:2.36}
  ];
  const PTS = FOOD.map((_, i) => (i+1)*(i+2)/2);

  // ---------- hand-drawn food characters (pre-rendered once, then stamped every frame)
  const U = 96, SPR_SIZE = U * 2.7;
  const INK = '#4A2E1A';
  function face(c, x, y, s, mood){
    // blush
    c.fillStyle = 'rgba(255,120,130,.55)';
    c.beginPath(); c.ellipse(x - s*.46, y + s*.16, s*.13, s*.08, 0, 0, Math.PI*2); c.ellipse(x + s*.46, y + s*.16, s*.13, s*.08, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = INK; c.fillStyle = INK; c.lineCap = 'round'; c.lineWidth = s*.07;
    if (mood === 'happy'){ // ^ ^
      [-1, 1].forEach(d => { c.beginPath(); c.arc(x + d*s*.27, y + s*.03, s*.1, Math.PI*1.1, Math.PI*1.9); c.stroke(); });
    } else if (mood === 'wink'){
      c.beginPath(); c.ellipse(x - s*.27, y, s*.075, s*.1, 0, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x + s*.27, y + s*.03, s*.1, Math.PI*1.1, Math.PI*1.9); c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x - s*.25, y - s*.035, s*.03, 0, Math.PI*2); c.fill();
    } else {
      [-1, 1].forEach(d => { c.beginPath(); c.ellipse(x + d*s*.27, y, s*.075, s*.1, 0, 0, Math.PI*2); c.fill(); });
      c.fillStyle = '#fff'; [-1, 1].forEach(d => { c.beginPath(); c.arc(x + d*s*.27 + s*.02, y - s*.035, s*.03, 0, Math.PI*2); c.fill(); });
    }
    c.fillStyle = INK; c.strokeStyle = INK; c.lineWidth = s*.06;
    if (mood === 'o'){ c.beginPath(); c.ellipse(x, y + s*.2, s*.06, s*.08, 0, 0, Math.PI*2); c.fill(); }
    else { // ω-style smile
      c.beginPath(); c.arc(x - s*.06, y + s*.13, s*.06, .2, Math.PI - .2); c.arc(x + s*.06, y + s*.13, s*.06, .2, Math.PI - .2); c.stroke();
    }
  }
  function outline(c, path){ path(); c.lineWidth = U*.07; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke(); }
  function circ(c, r = U*.97){ c.beginPath(); c.arc(0, 0, r, 0, Math.PI*2); }
  const DRAW = [
    c => { // 0 계란: fried egg, yolk is the face
      const blob = () => { c.beginPath(); for (let i = 0; i <= 60; i++){ const a = i/60*Math.PI*2, rr = U*(.9 + .06*Math.sin(a*5) + .03*Math.sin(a*3)); c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } c.closePath(); };
      blob(); c.fillStyle = '#FFFFFF'; c.fill(); outline(c, blob);
      c.beginPath(); c.arc(0, U*.05, U*.55, 0, Math.PI*2); c.fillStyle = '#FFC531'; c.fill(); c.lineWidth = U*.05; c.strokeStyle = '#E79A12'; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-U*.22, -U*.18, U*.13, U*.07, -.5, 0, Math.PI*2); c.fill();
      face(c, 0, U*.07, U*.62, 'normal');
    },
    c => { // 1 주먹밥: rice ball with nori
      const tri = () => { c.beginPath(); c.moveTo(0, -U*.95); c.bezierCurveTo(U*.5, -U*.9, U*1.0, U*.35, U*.85, U*.7); c.bezierCurveTo(U*.6, U*1.0, -U*.6, U*1.0, -U*.85, U*.7); c.bezierCurveTo(-U*1.0, U*.35, -U*.5, -U*.9, 0, -U*.95); c.closePath(); };
      tri(); c.fillStyle = '#FCFBF5'; c.fill();
      c.save(); tri(); c.clip();
      c.fillStyle = '#ECE8DA'; for (let i = 0; i < 18; i++){ const a = i*2.4, rr = U*(.15 + (i%5)*.15); c.beginPath(); c.ellipse(Math.cos(a)*rr, Math.sin(a)*rr - U*.2, U*.06, U*.035, a, 0, Math.PI*2); c.fill(); }
      c.fillStyle = '#1E2A24'; c.fillRect(-U*.45, U*.38, U*.9, U*.7);
      c.fillStyle = '#2E4036'; c.fillRect(-U*.45, U*.38, U*.9, U*.06);
      c.restore(); outline(c, tri);
      face(c, 0, -U*.05, U*.8, 'happy');
    },
    c => { // 2 만두: dumpling with pleats
      const sh = () => { c.beginPath(); c.moveTo(-U*.95, U*.25); c.bezierCurveTo(-U*.95, -U*.75, U*.95, -U*.75, U*.95, U*.25); c.bezierCurveTo(U*.95, U*.85, -U*.95, U*.85, -U*.95, U*.25); c.closePath(); };
      sh(); c.fillStyle = '#F8E6C4'; c.fill(); outline(c, sh);
      c.strokeStyle = '#C9A46E'; c.lineWidth = U*.05; c.lineCap = 'round';
      for (let i = -2; i <= 2; i++){ c.beginPath(); c.moveTo(i*U*.22, -U*.5 + Math.abs(i)*U*.06); c.quadraticCurveTo(i*U*.22 + U*.08, -U*.3, i*U*.2, -U*.12 + Math.abs(i)*U*.04); c.stroke(); }
      face(c, 0, U*.22, U*.75, 'normal');
    },
    c => { // 3 새우튀김: golden batter + red tail
      c.save(); c.translate(U*.5, -U*.62); c.rotate(.55);
      c.beginPath(); c.moveTo(0, U*.25); c.lineTo(-U*.42, -U*.55); c.lineTo(0, -U*.32); c.lineTo(U*.42, -U*.55); c.closePath();
      c.fillStyle = '#F2553D'; c.fill(); c.lineWidth = U*.06; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke(); c.restore();
      const sh = () => circ(c, U*.86);
      sh(); c.fillStyle = '#F2B046'; c.fill();
      c.save(); sh(); c.clip(); c.fillStyle = '#E09530';
      for (let i = 0; i < 26; i++){ const a = i*2.39, rr = U*(.2 + (i%6)*.12); c.beginPath(); c.arc(Math.cos(a)*rr, Math.sin(a)*rr, U*(.05 + (i%3)*.02), 0, Math.PI*2); c.fill(); }
      c.restore(); outline(c, sh);
      face(c, 0, U*.08, U*.8, 'wink');
    },
    c => { // 4 어묵: fishcake skewer
      c.fillStyle = '#E2B97E'; c.fillRect(-U*.1, -U*1.18, U*.2, U*.7); c.lineWidth = U*.06; c.strokeStyle = INK; c.strokeRect(-U*.1, -U*1.18, U*.2, U*.7);
      const sh = () => circ(c, U*.84);
      sh(); c.fillStyle = '#EFC890'; c.fill();
      c.save(); sh(); c.clip(); c.strokeStyle = '#D4A464'; c.lineWidth = U*.09;
      for (let k = -2; k <= 2; k++){ c.beginPath(); for (let x = -U; x <= U; x += U*.1) c.lineTo(x, k*U*.36 + Math.sin(x/U*7)*U*.06); c.stroke(); }
      c.restore(); outline(c, sh);
      face(c, 0, U*.05, U*.78, 'normal');
    },
    c => { // 5 치킨: drumstick with bone
      c.save(); c.translate(U*.58, -U*.66); c.rotate(.75);
      c.fillStyle = '#FFF8EC'; c.strokeStyle = INK; c.lineWidth = U*.06;
      [-1, 1].forEach(d => { c.beginPath(); c.arc(d*U*.15, -U*.5, U*.16, 0, Math.PI*2); c.fill(); c.stroke(); });
      c.beginPath(); c.rect(-U*.11, -U*.5, U*.22, U*.6); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-U*.11, -U*.42); c.lineTo(U*.11, -U*.42); c.strokeStyle = '#FFF8EC'; c.stroke();
      c.restore();
      const sh = () => circ(c, U*.88);
      sh(); c.fillStyle = '#C9733A'; c.fill();
      c.save(); sh(); c.clip(); c.fillStyle = '#B05F2B';
      for (let i = 0; i < 22; i++){ const a = i*2.39, rr = U*(.25 + (i%5)*.14); c.beginPath(); c.ellipse(Math.cos(a)*rr, Math.sin(a)*rr, U*.1, U*.05, a, 0, Math.PI*2); c.fill(); }
      c.fillStyle = 'rgba(255,220,160,.35)'; c.beginPath(); c.ellipse(-U*.3, -U*.35, U*.25, U*.12, -.6, 0, Math.PI*2); c.fill();
      c.restore(); outline(c, sh);
      face(c, 0, U*.1, U*.8, 'happy');
    },
    c => { // 6 버거: layered
      const sh = () => circ(c);
      c.save(); sh(); c.clip();
      c.fillStyle = '#E8A13E'; c.fillRect(-U, -U, U*2, U*1.05);
      c.fillStyle = '#FFF3D6'; for (let i = 0; i < 9; i++){ c.beginPath(); c.ellipse(-U*.55 + (i%5)*U*.27, -U*.68 + Math.floor(i/5)*U*.2, U*.05, U*.025, .4, 0, Math.PI*2); c.fill(); }
      c.fillStyle = '#7CC35A'; c.beginPath(); c.moveTo(-U, U*.05); for (let x = -U; x <= U; x += U*.2) c.lineTo(x, U*.05 + (Math.round(x/U*5)%2 ? U*.1 : 0)); c.lineTo(U, U*.22); c.lineTo(-U, U*.22); c.fill();
      c.fillStyle = '#FFD23F'; c.fillRect(-U, U*.18, U*2, U*.1);
      c.fillStyle = '#6B3B22'; c.fillRect(-U, U*.28, U*2, U*.26);
      c.fillStyle = '#E8A13E'; c.fillRect(-U, U*.54, U*2, U*.5);
      c.restore(); outline(c, sh);
      face(c, 0, -U*.3, U*.75, 'normal');
    },
    c => { // 7 피자
      const sh = () => circ(c);
      sh(); c.fillStyle = '#E3A35A'; c.fill();
      c.beginPath(); c.arc(0, 0, U*.8, 0, Math.PI*2); c.fillStyle = '#E4572E'; c.fill();
      c.beginPath(); for (let i = 0; i <= 40; i++){ const a = i/40*Math.PI*2, rr = U*(.7 + .05*Math.sin(a*7)); c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } c.closePath(); c.fillStyle = '#FFD45C'; c.fill();
      c.fillStyle = '#C7372F'; [[-.45,-.4],[.42,-.42],[-.5,.38],[.48,.4],[0,-.62],[0,.6]].forEach(([x,y]) => { c.beginPath(); c.arc(x*U, y*U, U*.13, 0, Math.PI*2); c.fill(); });
      c.fillStyle = '#3F8E3A'; [[-.2,-.3],[.25,.55],[-.62,0]].forEach(([x,y]) => { c.beginPath(); c.ellipse(x*U, y*U, U*.07, U*.035, x*3, 0, Math.PI*2); c.fill(); });
      outline(c, sh);
      face(c, 0, U*.05, U*.62, 'wink');
    },
    c => { // 8 라면: bowl with noodles and egg
      const sh = () => circ(c);
      c.save(); sh(); c.clip();
      c.fillStyle = '#F4C06B'; c.fillRect(-U, -U, U*2, U*1.0);
      c.strokeStyle = '#FFE7A8'; c.lineWidth = U*.06;
      for (let k = 0; k < 4; k++){ c.beginPath(); for (let x = -U; x <= U; x += U*.08) c.lineTo(x, -U*.65 + k*U*.15 + Math.sin(x/U*9 + k)*U*.05); c.stroke(); }
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(U*.42, -U*.48, U*.2, U*.15, 0, 0, Math.PI*2); c.fill();
      c.fillStyle = '#FFB520'; c.beginPath(); c.arc(U*.42, -U*.48, U*.09, 0, Math.PI*2); c.fill();
      c.fillStyle = '#4CAF50'; [[-.5,-.55],[-.3,-.42],[-.6,-.35],[.05,-.6]].forEach(([x,y]) => { c.beginPath(); c.arc(x*U, y*U, U*.045, 0, Math.PI*2); c.fill(); });
      c.fillStyle = '#D9443A'; c.fillRect(-U, -U*.12, U*2, U*1.2);
      c.fillStyle = '#FFFFFF'; c.fillRect(-U, -U*.12, U*2, U*.08);
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = U*.04;
      for (let x = -U*.8; x < U; x += U*.32){ c.beginPath(); c.moveTo(x, U*.72); c.lineTo(x + U*.12, U*.6); c.lineTo(x + U*.24, U*.72); c.stroke(); }
      c.restore(); outline(c, sh);
      c.fillStyle = INK; c.fillRect(-U*.1, -U*1.05, U*.06, U*.6); c.fillRect(U*.02, -U*1.05, U*.06, U*.6);
      face(c, 0, U*.28, U*.7, 'happy');
    },
    c => { // 9 도시락: the goal — golden lunchbox with compartments
      const sh = () => circ(c);
      sh(); c.fillStyle = '#2F6E4E'; c.fill();
      c.save(); sh(); c.clip();
      c.fillStyle = '#FFFFFF'; c.fillRect(-U*.72, -U*.6, U*.7, U*.62);
      c.fillStyle = '#E4572E'; c.fillRect(U*.06, -U*.6, U*.66, U*.3);
      c.fillStyle = '#FFD23F'; c.fillRect(U*.06, -U*.24, U*.66, U*.26);
      c.fillStyle = '#7CC35A'; c.fillRect(-U*.72, U*.08, U*1.44, U*.6);
      c.strokeStyle = '#1F4A35'; c.lineWidth = U*.06; c.strokeRect(-U*.72, -U*.6, U*1.44, U*1.28);
      c.beginPath(); c.moveTo(0, -U*.6); c.lineTo(0, U*.05); c.moveTo(-U*.72, U*.05); c.lineTo(U*.72, U*.05); c.stroke();
      c.restore(); outline(c, sh);
      c.fillStyle = '#FFD23F'; c.strokeStyle = INK; c.lineWidth = U*.04;
      c.beginPath(); c.moveTo(-U*.3, -U*.82); c.lineTo(-U*.3, -U*1.08); c.lineTo(-U*.15, -U*.95); c.lineTo(0, -U*1.12); c.lineTo(U*.15, -U*.95); c.lineTo(U*.3, -U*1.08); c.lineTo(U*.3, -U*.82); c.closePath(); c.fill(); c.stroke();
      face(c, 0, U*.38, U*.6, 'happy');
    }
  ];
  const SPR = DRAW.map(fn => {
    const cvs = document.createElement('canvas'); cvs.width = cvs.height = SPR_SIZE;
    const c = cvs.getContext('2d'); c.translate(SPR_SIZE/2, SPR_SIZE/2); fn(c); return cvs;
  });
  const SPR_URL = SPR.map(cv => { try { return cv.toDataURL(); } catch(e){ return ''; } });
  const img = (i, px) => `<img src="${SPR_URL[i]}" alt="${FOOD[i].n}" width="${px}" height="${px}" style="vertical-align:middle">`;
  const MAXT = FOOD.length - 1;

  // ---------- daily seed
  const NOW = new Date();
  const DKEY = `${NOW.getFullYear()}-${String(NOW.getMonth()+1).padStart(2,'0')}-${String(NOW.getDate()).padStart(2,'0')}`;
  const DLABEL = `${NOW.getMonth()+1}월 ${NOW.getDate()}일`;
  const BEST_KEY = 'lunch:' + DKEY, ALL_KEY = 'lunch:best';
  function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
  $('date').textContent = `${DLABEL} · 오늘은 모두 같은 순서`;

  // ---------- audio
  let AC = null;
  function audio(){ if (AC){ AC.resume && AC.resume(); return; } try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  function pop(t){
    if (!AC) return; const now = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; const f = 330 * Math.pow(1.122, t); o.frequency.setValueAtTime(f, now); o.frequency.exponentialRampToValueAtTime(f*1.5, now+.08);
    g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(.18, now+.01); g.gain.exponentialRampToValueAtTime(.0001, now+.22);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+.25);
  }
  function thud(){
    if (!AC) return; const now = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, now); o.frequency.exponentialRampToValueAtTime(60, now+.12);
    g.gain.setValueAtTime(.16, now); g.gain.exponentialRampToValueAtTime(.0001, now+.15); o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+.16);
  }

  // ---------- layout
  let W = 0, H = 0, DPR = 1, S = 1, box = {};
  function resize(){
    const r = $('stage').getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
    const oldS = S, oldBox = box;
    W = r.width; H = r.height; cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
    const bw = Math.min(W, H * 0.78);                   // lunchbox keeps a fixed shape
    S = bw / 360;
    const bh = Math.min(H - 12*S, bw * 1.22);            // cap depth so a round stays ~5 minutes
    const off = Math.max(0, (H - 12*S - bh) / 2);
    box = {l:(W-bw)/2 + 10*S, r:(W+bw)/2 - 10*S, b:H - 8*S - off, t:H - 8*S - off - bh};
    box.line = box.t + 66*S;                            // drop zone above the dashed line
    if (G && oldBox.l !== undefined && oldS !== S){      // rescale existing food so a resize doesn't break the pile
      const k = S/oldS;
      G.balls.forEach(b => { b.x = box.l + (b.x - oldBox.l)*k; b.y = box.b - (oldBox.b - b.y)*k; b.r = rad(b.t); });
    }
  }
  const rad = t => FOOD[t].s * 31 * S;

  // ---------- game state
  let G = null;
  function newGame(){
    G = {balls:[], score:0, rng:mulberry(hash('lunch:' + DKEY)), cur:0, next:0, aim:W/2, canDrop:true, cool:0,
         over:false, overT:0, running:false, maxT:0, merges:0, fx:[], id:0,
         // dynamic pace: heat builds while the box is half full; 3 quick merges in a row buy a slow-down
         fill:0, heat:0, rush:false, slow:0, combo:0, dropMerged:true, clock:0, auto:0, banner:null};
    G.cur = pick(); G.next = pick(); G.aim = (box.l + box.r)/2;
    $('score').textContent = '0'; ladder();
  }
  function pick(){ // daily sequence: mostly small foods
    const w = [30, 26, 20, 14, 10], r = G.rng() * 100; let a = 0;
    for (let i = 0; i < w.length; i++){ a += w[i]; if (r < a) return i; }
    return 0;
  }
  function ladder(pulse){
    $('ladder').innerHTML = FOOD.map((f, i) => `<span class="${i <= G.maxT ? 'got' : ''}${pulse === i ? ' pop' : ''}" title="${f.n}">${img(i, 26)}</span>`).join('<i>›</i>');
    if (pulse !== undefined) setTimeout(() => { const s = $('ladder').querySelectorAll('span')[pulse]; s && s.classList.remove('pop'); }, 220);
  }

  // ---------- input
  const st = $('stage');
  function aimAt(e){ const r = cv.getBoundingClientRect(); G.aim = e.clientX - r.left; }
  st.addEventListener('pointermove', e => { if (G && G.running) aimAt(e); });
  st.addEventListener('pointerdown', e => { if (!G || !G.running) return; e.preventDefault(); try { st.setPointerCapture(e.pointerId); } catch(_){} aimAt(e); });
  st.addEventListener('pointerup', e => { if (!G || !G.running) return; aimAt(e); drop(); });
  window.addEventListener('keydown', e => {
    if (!G || !G.running) return;
    if (e.code === 'ArrowLeft') G.aim -= 14*S; else if (e.code === 'ArrowRight') G.aim += 14*S;
    else if (e.code === 'Space' || e.code === 'ArrowDown'){ e.preventDefault(); drop(); }
  });

  function clampAim(t){ const r = rad(t); return Math.max(box.l + r, Math.min(box.r - r, G.aim)); }
  function drop(){
    if (!G.canDrop || G.over) return;
    const t = G.cur, r = rad(t);
    if (!G.dropMerged) G.combo = 0; G.dropMerged = false;
    G.balls.push({id:++G.id, t, x:clampAim(t), y:box.line - r - 6*S, vx:0, vy:0, r, a:0, age:0});
    G.cur = G.next; G.next = pick(); G.canDrop = false; G.cool = .45 * (G.slow > 0 ? 1 : 1 - G.heat*.45); G.auto = autoLimit(); thud();
  }
  // ---------- pace
  const RUSH_AT = .5;
  const gMul = () => G.slow > 0 ? .55 : 1 + G.heat*.9;              // how fast food falls
  const autoLimit = () => 3.4 - G.heat*1.9;                          // seconds before food drops by itself
  function measureFill(){
    let top = box.b;
    for (const b of G.balls) if (b.age > .8 && Math.abs(b.vy) < 160*S) top = Math.min(top, b.y - b.r);
    return Math.max(0, Math.min(1, (box.b - top) / (box.b - box.line)));
  }
  function banner(txt, col){ G.banner = {txt, col, t:0}; }
  function pace(dt){
    G.clock += dt;
    G.fill = measureFill();
    if (G.slow > 0){ G.slow -= dt; if (G.slow <= 0){ G.slow = 0; if (G.rush) banner('🔥 다시 빨라져요!', 'danger'); } }
    if (G.fill >= RUSH_AT){
      if (!G.rush){ G.rush = true; if (G.slow <= 0) banner('🔥 반이나 찼어요! 빨라져요', 'danger'); }
      if (G.slow <= 0) G.heat = Math.min(1, G.heat + dt/35);
    } else if (G.fill < RUSH_AT - .12){
      G.rush = false; G.heat = Math.max(0, G.heat - dt/18);
    }
    // in a rush, food drops by itself when you hesitate
    if (G.rush && G.slow <= 0 && G.canDrop && !G.over){
      G.auto -= dt; if (G.auto <= 0) drop();
    } else if (G.canDrop) G.auto = autoLimit();
  }
  // a "combo" = consecutive drops that each make at least one merge
  function onMergeCombo(){
    if (G.dropMerged) return;
    G.dropMerged = true; G.combo++;
    if (G.combo >= 3 && G.slow <= 0 && (G.rush || G.heat > 0)){
      G.slow = 6; G.heat = Math.max(0, G.heat - .35); G.combo = 0;
      banner('🐢 3연속 합치기! 잠깐 느려져요', 'calm');
    } else if (G.combo >= 2) G.fx.push({x:(box.l+box.r)/2, y:box.line + 34*S, r:0, t:0, txt:`${G.combo}연속 합치기!`});
  }

  // ---------- physics
  function step(dt){
    const g = 2300*S*gMul(), bs = G.balls;
    for (const b of bs){
      b.vy += g*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.age += dt;
      b.vx *= .996; b.vy *= .999; b.a += b.vx*dt / b.r;
    }
    for (let it = 0; it < 3; it++){
      for (let i = 0; i < bs.length; i++){
        const a = bs[i];
        for (let j = i+1; j < bs.length; j++){
          const b = bs[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx*dx + dy*dy;
          if (d2 >= rr*rr || d2 === 0) continue;
          const d = Math.sqrt(d2), nx = dx/d, ny = dy/d, ov = rr - d;
          if (a.t === b.t && a.t < MAXT && !a.dead && !b.dead){ merge(a, b); continue; }
          const ia = 1/(a.r*a.r), ib = 1/(b.r*b.r), sum = ia + ib;
          a.x -= nx*ov*ia/sum; a.y -= ny*ov*ia/sum; b.x += nx*ov*ib/sum; b.y += ny*ov*ib/sum;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx*nx + rvy*ny;
          if (vn < 0){
            const j2 = -(1.12)*vn/sum;
            a.vx -= j2*ia*nx; a.vy -= j2*ia*ny; b.vx += j2*ib*nx; b.vy += j2*ib*ny;
            const tx = -ny, ty = nx, vt = rvx*tx + rvy*ty, jt = -vt*.05/sum;
            a.vx -= jt*ia*tx; a.vy -= jt*ia*ty; b.vx += jt*ib*tx; b.vy += jt*ib*ty;
          }
        }
      }
      for (const b of bs){
        if (b.x - b.r < box.l){ b.x = box.l + b.r; if (b.vx < 0) b.vx *= -.2; }
        if (b.x + b.r > box.r){ b.x = box.r - b.r; if (b.vx > 0) b.vx *= -.2; }
        if (b.y + b.r > box.b){ b.y = box.b - b.r; if (b.vy > 0) b.vy *= -.15; b.vx *= .97; }
      }
    }
    G.balls = bs.filter(b => !b.dead);
  }
  function merge(a, b){
    a.dead = b.dead = true;
    const t = a.t + 1, r = rad(t);
    const nb = {id:++G.id, t, x:(a.x+b.x)/2, y:(a.y+b.y)/2, vx:(a.vx+b.vx)/2, vy:Math.min(a.vy, b.vy)/2 - 120*S, r, a:0, age:1, born:.18};
    G.balls.push(nb);
    G.score += PTS[t]; G.merges++; onMergeCombo();
    $('score').textContent = G.score.toLocaleString();
    G.fx.push({x:nb.x, y:nb.y, r, t:0, e:FOOD[t].e, pts:PTS[t]});
    pop(t);
    if (t > G.maxT){ G.maxT = t; ladder(t); }
    if (t === MAXT){ G.score += 100; $('score').textContent = G.score.toLocaleString(); G.fx.push({x:nb.x, y:nb.y - r, r:0, t:0, txt:'도시락 완성! +100'}); }
  }

  // ---------- render
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function drawFood(b, ghost){
    const k = b.born ? 1 - b.born/.18*.4 : 1, r = b.r * k, sz = r * SPR_SIZE / U;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate((b.a || 0) * .5);
    if (ghost) ctx.globalAlpha = .55;
    ctx.drawImage(SPR[b.t], -sz/2, -sz/2, sz, sz);
    ctx.restore();
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    const C = {box:css('--box'), inn:css('--box-in'), edge:css('--box-edge'), danger:css('--danger'), muted:css('--muted'), ink:css('--ink')};
    // lunchbox
    const pad = 8*S;
    ctx.fillStyle = C.box; roundRect(box.l - pad, box.t, box.r - box.l + pad*2, box.b - box.t + pad, 18*S); ctx.fill();
    ctx.fillStyle = C.inn; roundRect(box.l, box.t + pad, box.r - box.l, box.b - box.t - pad, 12*S); ctx.fill();
    ctx.strokeStyle = C.edge; ctx.lineWidth = 2*S; ctx.globalAlpha = .35;
    for (let x = box.l + 40*S; x < box.r; x += 40*S){ ctx.beginPath(); ctx.moveTo(x, box.t + pad); ctx.lineTo(x, box.t + pad + 6*S); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // danger line
    const danger = G.overT > 0;
    ctx.setLineDash([8*S, 6*S]); ctx.lineWidth = 2*S;
    ctx.strokeStyle = danger ? C.danger : C.muted; ctx.globalAlpha = danger ? (.5 + .5*Math.sin(performance.now()/90)) : .45;
    ctx.beginPath(); ctx.moveTo(box.l, box.line); ctx.lineTo(box.r, box.line); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    // aim guide + current food
    if (G.running && !G.over){
      const x = clampAim(G.cur), r = rad(G.cur), y = box.line - r - 6*S;
      ctx.strokeStyle = C.muted; ctx.globalAlpha = .35; ctx.lineWidth = 1.5*S; ctx.setLineDash([3*S, 5*S]);
      ctx.beginPath(); ctx.moveTo(x, y + r); ctx.lineTo(x, box.b); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      if (G.canDrop) drawFood({t:G.cur, x, y, r, a:0});
      // auto-drop countdown ring while rushing
      if (G.canDrop && G.rush && G.slow <= 0){
        const k = Math.max(0, G.auto / autoLimit());
        ctx.strokeStyle = C.danger; ctx.lineWidth = 3.5*S; ctx.globalAlpha = .85;
        ctx.beginPath(); ctx.arc(x, y, r + 6*S, -Math.PI/2, -Math.PI/2 + Math.PI*2*k); ctx.stroke(); ctx.globalAlpha = 1;
      }
      // next preview
      const nr = 14*S, nx = box.r - nr - 6*S, ny = box.t + pad + nr + 8*S;
      ctx.fillStyle = C.muted; ctx.font = `700 ${10*S+2}px Gothic A1, sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText('다음', nx - nr - 6*S, ny);
      drawFood({t:G.next, x:nx, y:ny, r:nr, a:0});
      // speed meter (top-left)
      const mx = box.l + 8*S, my = ny, lv = G.slow > 0 ? 0 : (G.rush ? 1 + Math.round(G.heat*3) : 0);
      ctx.textAlign = 'left'; ctx.fillStyle = G.slow > 0 ? '#3B8FD9' : (lv ? C.danger : C.muted);
      ctx.fillText(G.slow > 0 ? `🐢 느리게 ${Math.ceil(G.slow)}초` : '속도', mx, my);
      if (G.slow <= 0) for (let i = 0; i < 4; i++){
        ctx.globalAlpha = i < lv ? 1 : .22; ctx.fillStyle = i < lv ? C.danger : C.muted;
        roundRect(mx + 30*S + i*11*S, my - 6*S, 8*S, 12*S, 2*S); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // slow-motion tint
    if (G.slow > 0){ ctx.fillStyle = 'rgba(80,160,255,.08)'; ctx.fillRect(box.l, box.t, box.r - box.l, box.b - box.t); }
    for (const b of G.balls) drawFood(b);
    // effects
    for (const f of G.fx){
      const k = f.t / .6;
      if (f.txt){ ctx.globalAlpha = 1 - k; ctx.fillStyle = C.ink; ctx.font = `800 ${18*S+4}px Gothic A1, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(f.txt, f.x, f.y - k*40*S); ctx.globalAlpha = 1; continue; }
      ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*S;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + k*.6), 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.font = `800 ${12*S+4}px Gothic A1, sans-serif`; ctx.textAlign = 'center'; ctx.fillText('+' + f.pts, f.x, f.y - f.r - k*26*S);
      ctx.globalAlpha = 1;
    }
    // banner
    if (G.banner){
      const bn = G.banner, a = bn.t < .2 ? bn.t/.2 : (bn.t > 1.4 ? Math.max(0, (1.7 - bn.t)/.3) : 1);
      const by = box.t + (box.b - box.t)*.42, bw = box.r - box.l - 16*S, bh = 40*S;
      ctx.globalAlpha = a; ctx.fillStyle = bn.col === 'calm' ? '#2F7FC9' : C.danger;
      roundRect((box.l + box.r)/2 - bw/2, by - bh/2, bw, bh, 12*S); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `800 ${15*S+3}px Gothic A1, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(bn.txt, (box.l + box.r)/2, by); ctx.globalAlpha = 1;
    }
  }
  function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }

  // ---------- loop
  let last = 0;
  function frame(ts){
    const dt = Math.min(1/30, (ts - (last || ts))/1000); last = ts;
    if (G.running && !G.over){
      const n = 6; for (let i = 0; i < n; i++) step(dt/n);
      for (const b of G.balls) if (b.born){ b.born -= dt; if (b.born <= 0) b.born = 0; }
      if (!G.canDrop){ G.cool -= dt; if (G.cool <= 0){ G.canDrop = true; G.auto = autoLimit(); } }
      pace(dt);
      // overflow check: settled food above the line
      const above = G.balls.some(b => b.age > 1.1 && b.y - b.r < box.line && Math.abs(b.vy) < 120*S);
      G.overT = above ? G.overT + dt : 0;
      if (G.overT > 2) gameOver();
    }
    G.fx.forEach(f => f.t += dt); G.fx = G.fx.filter(f => f.t < .6);
    if (G.banner){ G.banner.t += dt; if (G.banner.t > 1.7) G.banner = null; }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- flow
  function openOv(html, bind){ $('card').innerHTML = html; $('ov').hidden = false; bind && bind(); }
  function closeOv(){ $('ov').hidden = true; }
  function refreshBest(){ const b = load(BEST_KEY); $('best').textContent = b ? b.score.toLocaleString() : '0'; }
  function evo(maxT){ return FOOD.slice(0, maxT+1).map(f => f.e).join(''); }
  function evoImg(maxT, px = 30){ return FOOD.slice(0, maxT+1).map((_, i) => img(i, px)).join(''); }

  function intro(){
    newGame(); refreshBest();
    const b = load(BEST_KEY);
    openOv(`<h2>🍱 도시락 합치기</h2>
      <p>같은 음식 두 개가 닿으면<br><b style="color:var(--ink)">한 단계 큰 음식</b>으로 합쳐져요.</p>
      <div class="evo">${evoImg(MAXT, 30)}</div>
      <p style="font-size:13px">👆 좌우로 끌어서 위치를 정하고 손을 떼면 떨어져요<br>음식이 점선 위로 넘치면 끝 · 오늘은 모두 <b style="color:var(--ink)">같은 순서</b></p>
      <p style="font-size:13px">🔥 도시락이 <b style="color:var(--ink)">반쯤 차면 빨라지고</b>, 머뭇거리면 저절로 떨어져요<br>🐢 <b style="color:var(--ink)">3연속 합치기</b>에 성공하면 잠깐 느려져요</p>
      ${b ? `<p>오늘 내 최고: <b style="color:var(--ink)">${b.score.toLocaleString()}점</b> · ${img(b.maxT,18)} ${FOOD[b.maxT].n}까지</p>` : ''}
      <button class="big" id="go">시작하기</button>`, () => $('go').onclick = () => { audio(); closeOv(); G.running = true; });
  }
  function gameOver(){
    G.over = true; G.running = false;
    const b = load(BEST_KEY), isBest = !b || G.score > b.score;
    if (isBest) save(BEST_KEY, {score:G.score, maxT:G.maxT});
    const all = load(ALL_KEY); if (!all || G.score > all.score) save(ALL_KEY, {score:G.score, maxT:G.maxT, d:DKEY});
    refreshBest();
    setTimeout(() => openOv(`<h2>도시락이 넘쳤어요!</h2>
      <div class="stats"><span class="chip">${G.score.toLocaleString()}점</span><span class="chip">${img(G.maxT,20)} ${FOOD[G.maxT].n}까지</span></div>
      <div class="evo">${evoImg(G.maxT, 30)}</div>
      <p>${isBest ? '오늘 최고 기록이에요! 🎉' : `오늘 최고는 ${b.score.toLocaleString()}점이에요.`}</p>
      <div id="joRank"></div>
      <button class="big" id="sh">결과 복사</button>
      <button class="ghost" id="again">다시 하기</button>`, () => {
        $('sh').onclick = () => copy(shareText(), $('sh'));
        $('again').onclick = () => { newGame(); closeOv(); G.running = true; };
        if (window.JO) JO.mini('lunch', $('joRank'), {score:G.score, stage:G.maxT + 1, day:DKEY});
      }), 500);
  }
  function shareText(){
    let t = `🍱 도시락 합치기 ${DLABEL}\n${G.score.toLocaleString()}점 · ${FOOD[G.maxT].e} ${FOOD[G.maxT].n}까지\n${evo(G.maxT)}\n`;
    if (/github\.io$/.test(location.hostname)) t += location.origin + location.pathname;
    return t.trim();
  }
  function copy(text, btn){
    const done = () => { btn.textContent = '복사됐어요! 카톡에 붙여 넣기'; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){ btn.textContent = '복사 실패 — 화면을 캡처해 주세요'; } ta.remove(); };
    try { navigator.clipboard.writeText(text).then(done, fb); } catch(e){ fb(); }
  }

  if ('ResizeObserver' in window) new ResizeObserver(resize).observe($('stage'));
  window.addEventListener('resize', resize);
  resize(); intro(); requestAnimationFrame(frame);
})();
</script>

</html>

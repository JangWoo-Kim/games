<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밤의 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* A dark classroom: the whole scene is covered by darkness except a flashlight beam that follows your finger.
   Single fixed night palette by design. Fits one phone screen (scene sized by JS). */
:root{
  --bg:#0A0B10; --panel:#161922; --panel2:#1F2430; --ink:#E9ECF2; --muted:#8C93A3;
  --accent:#C7F0FF; --blood:#E0565B; --uv:#B07CFF; --line:#2A3040;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding-inline:12px;padding-block:8px 10px;display:flex;flex-direction:column;gap:8px;height:100%;min-height:520px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
h1{font-family:"Nanum Brush Script","Gothic A1",sans-serif;font-weight:400;font-size:34px;margin:0;line-height:1;color:#F2F4F8;text-shadow:0 0 12px rgba(199,240,255,.25)}
.chips{display:flex;gap:6px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.iconBtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:13px}
.hintBtn{background:var(--accent);color:#0A0B10;border:0;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px}
.stage{flex:1 1 0;min-height:0;display:flex;justify-content:center;align-items:center}
#scene{display:block;border-radius:14px;border:2px solid var(--line);background:#000;touch-action:none}
#scene [data-obj]{cursor:pointer}
.flick{animation:flick .5s steps(2) 1}
@keyframes flick{0%{filter:brightness(.1)}40%{filter:brightness(1)}60%{filter:brightness(.05)}100%{filter:none}}
.msg{flex:none;min-height:46px;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.45;display:flex;align-items:center}
.msg.pop{animation:pop .25s ease}
.msg.scary{color:#FFB3B5}
@keyframes pop{from{opacity:.4}to{opacity:1}}
.bagHead{flex:none;font-size:12px;color:var(--muted);letter-spacing:.04em}
.bag{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{height:62px;min-width:0;background:var(--panel);border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:24px;padding:2px}
.slot small{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap}
.slot.has{border-style:solid;background:var(--panel2)}
.slot.sel{border-color:var(--uv);box-shadow:0 0 0 3px rgba(176,124,255,.35)}
.slot.sel small{color:var(--uv)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h2{font-family:"Nanum Brush Script","Gothic A1",sans-serif;font-weight:400;font-size:38px;margin:0;line-height:1.1}
.card p{margin:0;line-height:1.65;color:var(--muted)}
.big{background:var(--accent);color:#0A0B10;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:16px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700}
.paper{background:#E9E4D6;color:#2A2622;border-radius:4px;padding:16px;font-family:"Nanum Brush Script","Gothic A1",sans-serif;font-size:26px;line-height:1.35;transform:rotate(1.5deg);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.dials{display:flex;justify-content:center;gap:10px}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial button{width:52px;height:38px;border-radius:10px;border:0;background:var(--panel2);font-size:16px}
.dial .d{width:52px;height:58px;border-radius:10px;background:#05070A;color:#C7F0FF;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.stats .chip{font-size:15px}
#scare{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center}
#scare svg{width:min(80vw,380px);height:auto;animation:lunge .9s ease-out forwards}
@keyframes lunge{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.05);opacity:1}70%{transform:scale(1.15)}100%{transform:scale(1.4);opacity:0}}
.stages{display:grid;gap:8px}
.stg{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.stg i{font-style:normal;font-size:24px;text-align:center}
.stg b{display:block;font-size:15px}
.stg small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.stg em{font-style:normal;font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap}
.stg[disabled]{opacity:.4;cursor:not-allowed}
h1{white-space:nowrap;font-size:26px!important}
.hintBtn,.chip,.iconBtn{white-space:nowrap}
.top > div:first-child{min-width:0}
.jars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.jar{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.jar span{font-size:30px}.jar small{font-size:12px;color:var(--muted)}
.jar.nope{opacity:.35}
.mix{display:flex;justify-content:center;gap:12px}
.bk{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bk i{display:block;width:28px;height:38px;border-radius:4px 4px 10px 10px;background:var(--c);opacity:.9}
.bk small{font-size:12px}.bk.on{border-color:var(--accent)}
.flask{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:var(--ink)}
.flask i{display:block;width:34px;height:34px;border-radius:50%;background:var(--c,#333);border:2px solid var(--line)}
.keys{display:flex;justify-content:center;gap:4px}
.key{flex:1;max-width:58px;height:120px;background:#F2EFE6;color:#222;border-radius:0 0 8px 8px;border:1px solid #999;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800;font-size:18px;transition:background .1s}
.key.on,.keys.play .key:active{background:#C7A7FF}
.dial .d.cdot{flex-direction:column;gap:2px}
.cdot i{display:block;width:30px;height:30px;border-radius:50%}
.cdot small{font-size:11px;color:var(--muted);font-weight:700}
</style>

<div class="wrap">
  <div class="top">
    <div><a href="https://jangwoo-kim.github.io/games/" target="_top" style="display:block;font-size:12px;font-weight:700;color:inherit;opacity:.6;text-decoration:none;margin-bottom:3px">← 점오하게</a><h1>밤의 교실</h1></div>
    <div class="chips">
      <span class="chip" id="timer">0:00</span>
      <button class="iconBtn" id="snd" aria-label="소리">🔊</button>
      <button class="hintBtn" id="hintBtn">💡 힌트</button>

  </div>

  <div class="stage">

      <defs>

        <filter id="glow"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

      <g id="room1">
      <!-- room -->
      <rect width="360" height="272" fill="#36425A"/>
      <rect y="262" width="360" height="10" fill="#222A38"/>

      </g>

      <!-- blackboard -->
      <g data-obj="board">

      <!-- clock: stopped at today's secret time -->
      <g data-obj="clock">
        <circle cx="322" cy="44" r="17" fill="#D9D6CC" stroke="#4A4A50" stroke-width="3"/>
        <line id="cH" x1="322" y1="44" x2="322" y2="35" stroke="#222" stroke-width="3" stroke-linecap="round"/>
        <line id="cM" x1="322" y1="44" x2="322" y2="31" stroke="#222" stroke-width="2" stroke-linecap="round"/>

      <!-- lockers 11-14 -->
      <g data-obj="locker">

        </g>
        <g fill="#2A3443"><rect x="20" y="176" width="11" height="2"/><rect x="41" y="176" width="11" height="2"/><rect x="62" y="176" width="11" height="2"/><rect x="83" y="176" width="9" height="2"/></g>
        <g font-size="8" fill="#C8D2DE" font-weight="800" font-family="Gothic A1,sans-serif" text-anchor="middle">
          <text x="25" y="194">11</text><text x="46" y="194">12</text><text x="67" y="194">13</text><text x="87" y="194">14</text>
        </g>
        <g id="padlock"><rect x="62" y="214" width="10" height="9" rx="1" fill="#B9A15A"/><path d="M64,214 v-3 a3,3 0 0 1 6,0 v3" fill="none" stroke="#B9A15A" stroke-width="1.6"/></g>
        <g id="lockerOpen" display="none">
          <rect x="58" y="168" width="19" height="100" fill="#0B0D12"/>
          <polygon points="58,168 46,174 46,262 58,268" fill="#5A6C86"/>
        </g>
      </g>

      <!-- trash bin -->
      <g data-obj="trash">
        <polygon points="104,240 128,240 125,270 107,270" fill="#59606E"/>
        <rect x="102" y="237" width="28" height="5" rx="2" fill="#6B7383"/>
        <circle cx="113" cy="236" r="4" fill="#D8D2C2"/>
      </g>

      <!-- teacher desk -->
      <g data-obj="desk">
        <rect x="146" y="196" width="96" height="10" fill="#5A4632"/>
        <rect x="150" y="206" width="88" height="64" fill="#4A3A2A"/>
        <rect x="180" y="214" width="28" height="14" rx="2" fill="#3A2E22" stroke="#2A2018"/>
        <circle cx="194" cy="221" r="2.4" fill="#B9A15A"/>
        <rect x="162" y="186" width="24" height="10" fill="#7A6A5A"/><rect x="164" y="182" width="20" height="4" fill="#8F7F6E"/>

      <!-- skeleton model -->
      <g data-obj="skeleton">

          <rect x="277" y="162" width="6" height="8"/>
          <g fill="none" stroke="#DCD8CC" stroke-width="2.6">
            <path d="M270,174 q10,4 20,0"/><path d="M269,181 q11,4 22,0"/><path d="M270,188 q10,4 20,0"/><path d="M271,195 q9,3 18,0"/>

            <path d="M268,172 L260,200 L262,224"/><path d="M292,172 L300,200 L298,224"/>

        </g>
      </g>

      <!-- door -->
      <g data-obj="door">
        <rect x="300" y="100" width="54" height="170" fill="#3D3226"/>
        <rect x="306" y="108" width="42" height="40" fill="#22303F" stroke="#2A2018" stroke-width="2"/>

        <rect x="306" y="186" width="14" height="20" rx="2" fill="#1A1E26" stroke="#555"/>

          <rect x="8" y="100" width="56" height="170" fill="#3D3226"/>

          <rect x="38" y="178" width="22" height="34" rx="3" fill="#1A1E26" stroke="#666"/>

        <!-- window with moon -->
        <g data-obj="window">
          <rect x="170" y="32" width="76" height="70" fill="#16233A" stroke="#4A4A50" stroke-width="5"/>
          <circle cx="226" cy="52" r="10" fill="#E8EED9"/>
          <line x1="208" y1="32" x2="208" y2="102" stroke="#4A4A50" stroke-width="4"/>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('scene');
  const ITEMS = {
    note:{icon:'📄', name:'구겨진 쪽지', read:true},
    deskKey:{icon:'🔑', name:'교탁 열쇠'},
    uv:{icon:'🔦', name:'보라색 손전등'},
    // stage 2 · science lab
    cabKey:{icon:'🗝️', name:'약품장 열쇠'},
    slide:{icon:'🧫', name:'유리 슬라이드'},
    memo:{icon:'🧪', name:'현미경 메모', read:true},
    // stage 3 · music room
    stick:{icon:'🥢', name:'북채'},
    pianoKey:{icon:'🔑', name:'피아노 열쇠'},
    tape:{icon:'📼', name:'카세트테이프'}
  };
  // each stage is a different room with its own puzzle chain
  const STG = [
    {name:'1단계', sub:'5학년 3반 교실',     R:88, spook:[28,48], limit:0,   room:'교실'},
    {name:'2단계', sub:'과학실',             R:80, spook:[18,32], limit:0,   room:'과학실'},
    {name:'3단계', sub:'음악실 · 4분 안에',   R:72, spook:[12,22], limit:240, room:'음악실'}
  ];
  const NOW = new Date();
  const DKEY = `${NOW.getFullYear()}-${String(NOW.getMonth()+1).padStart(2,'0')}-${String(NOW.getDate()).padStart(2,'0')}`;
  const DLABEL = `${NOW.getMonth()+1}월 ${NOW.getDate()}일`;
  function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

  // colour-mixing for the lab door
  const CL = [
    {k:'R', n:'빨강', c:'#E0565B'}, {k:'O', n:'주황', c:'#F08A3C'}, {k:'Y', n:'노랑', c:'#F2C230'},
    {k:'G', n:'초록', c:'#4CAF6A'}, {k:'B', n:'파랑', c:'#3B6FD4'}, {k:'P', n:'보라', c:'#9B5DE5'}
  ];
  const MIX = {RB:'P', BR:'P', YB:'G', BY:'G', RY:'O', YR:'O'};
  const ci = k => CL.findIndex(c => c.k === k);
  const JARS = [{e:'👁️', n:'눈알'}, {e:'🐸', n:'개구리'}, {e:'🐙', n:'문어'}, {e:'🐍', n:'뱀'}];
  // notes for the music room
  const NOTES = [{n:'도', f:262}, {n:'레', f:294}, {n:'미', f:330}, {n:'파', f:349}, {n:'솔', f:392}];

  let P, R = 88;
  function buildPuzzle(n){
    const rng = mulberry(hash(`night:${DKEY}:s${n}`)), C = STG[n-1];
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const p = {n, C};
    if (n === 1){
      p.h = 1 + Math.floor(rng()*9); p.m = 10 + Math.floor(rng()*50);
      p.lockerCode = [p.h, Math.floor(p.m/10), p.m%10];
      p.front = [Math.floor(rng()*10), Math.floor(rng()*10)]; p.back = [Math.floor(rng()*10), Math.floor(rng()*10)];
      p.doorCode = [...p.front, ...p.back];
    } else if (n === 2){
      p.pairs = shuffle([['R','B'], ['Y','B'], ['R','Y']]).map(pr => rng() < .5 ? pr : [pr[1], pr[0]]);
      p.doorCode = p.pairs.map(([a, b]) => ci(MIX[a+b]));
      p.jar = Math.floor(rng()*4);
    } else {
      const mel = []; while (mel.length < 4){ const x = Math.floor(rng()*5); if (x !== mel[mel.length-1]) mel.push(x); }
      p.melody = mel;
    }
    return p;
  }
  let S;
  function reset(){
    S = {inv:[], sel:null, hints:0, t0:0, running:false, light:{x:180,y:220}, warned:false, escaped:false,
         // s1
         note:false, locker:false, desk:false, uvBoard:false, uvSkel:false, windowSeen:0,
         // s2
         sinkKey:false, cab:false, slide:false, scoped:false, mixSeen:false,
         // s3
         stick:false, drum:false, lid:false, tape:false, heard:false, played:false, modelPoke:0};
  }

  // ---------- sound (Web Audio, starts on first button press)
  let AC = null, master = null, muted = false;
  function audioInit(){
    if (AC) { AC.resume && AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
      const g = AC.createGain(); g.gain.value = 0.05; lp.connect(g); g.connect(master);
      [55, 58.3, 82.5].forEach(f => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); });
      const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.12; lg.gain.value = 0.03; lfo.connect(lg); lg.connect(g.gain); lfo.start();
    } catch(e){ AC = null; }
  }
  function noiseBuf(sec){ const b = AC.createBuffer(1, AC.sampleRate*sec, AC.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b; }
  function stinger(){
    if (!AC) return; const t = AC.currentTime;
    [196, 277, 370, 523].forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f*1.06, t+0.8);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t+0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+1.1);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+1.2);
    });
    const n = AC.createBufferSource(), ng = AC.createGain(), hp = AC.createBiquadFilter(); n.buffer = noiseBuf(0.6); hp.type = 'highpass'; hp.frequency.value = 1500;
    ng.gain.setValueAtTime(0.25, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.6); n.connect(hp); hp.connect(ng); ng.connect(master); n.start(t);
  }
  function creak(){
    if (!AC) return; const t = AC.currentTime;
    const n = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain(); n.buffer = noiseBuf(1.2);
    bp.type = 'bandpass'; bp.Q.value = 18; bp.frequency.setValueAtTime(300, t); bp.frequency.linearRampToValueAtTime(900, t+0.5); bp.frequency.linearRampToValueAtTime(400, t+1.1);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t+0.1); g.gain.exponentialRampToValueAtTime(0.0001, t+1.2);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(t);
  }
  function whisper(){
    if (!AC) return; const t = AC.currentTime;
    const n = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain(); n.buffer = noiseBuf(1.6);
    bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 3;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.08, t+0.4); g.gain.linearRampToValueAtTime(0.0001, t+1.5);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(t);
  }
  function click(){
    if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = 900; g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.06);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.07);
  }
  function boom(){ // bass drum
    if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t+.4);
    g.gain.setValueAtTime(.6, t); g.gain.exponentialRampToValueAtTime(.0001, t+.6); o.connect(g); g.connect(master); o.start(t); o.stop(t+.65);
  }
  function note(f, dur = .45, detune = 0){ // slightly out-of-tune piano tone
    if (!AC) return; const t = AC.currentTime;
    [1, 2.01].forEach((m, i) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = i ? 'sine' : 'triangle'; o.frequency.value = f*m; o.detune.value = detune;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(i ? .05 : .2, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur+.4);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.5);
    });
  }
  function bubble(){
    if (!AC) return; const t = AC.currentTime;
    for (let i = 0; i < 4; i++){ const o = AC.createOscillator(), g = AC.createGain(), s = t + i*.09; o.type = 'sine';
      o.frequency.setValueAtTime(300 + Math.random()*300, s); o.frequency.exponentialRampToValueAtTime(900, s+.08);
      g.gain.setValueAtTime(.08, s); g.gain.exponentialRampToValueAtTime(.0001, s+.1); o.connect(g); g.connect(master); o.start(s); o.stop(s+.12); }
  }
  $('snd').onclick = () => {
    muted = !muted; $('snd').textContent = muted ? '🔇' : '🔊';
    if (master) master.gain.value = muted ? 0 : 0.9;
  };

  // ---------- layout fit
  const stage = document.querySelector('.stage');
  function fit(){
    const r = stage.getBoundingClientRect();
    const w = Math.max(200, Math.min(r.width, r.height * 0.9));
    svg.style.width = w + 'px'; svg.style.height = (w / 0.9) + 'px';
  }
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit); fit();

  // ---------- flashlight
  function toSvg(e){
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : {x:180,y:220};
  }
  function setLight(x, y){
    S.light = {x, y};
    $('beamHole').setAttribute('cx', x); $('beamHole').setAttribute('cy', y);
    $('beamTint').setAttribute('cx', x); $('beamTint').setAttribute('cy', y);
  }
  function beamColor(){ $('beamTint').setAttribute('opacity', S.sel === 'uv' ? '.22' : '0'); }
  svg.addEventListener('pointermove', e => { if (!S || !S.running) return; const p = toSvg(e); setLight(p.x, p.y); });
  svg.addEventListener('click', e => { if (!S || !S.running) return; const p = toSvg(e); setLight(p.x, p.y); });

  // ---------- today's puzzle → scene
  function applyStage(){
    R = P.C.R; $('beamHole').setAttribute('r', R); $('beamTint').setAttribute('r', R*.8);
    [1, 2, 3].forEach(i => show('room' + i, i === P.n));
    if (P.n === 1){
      $('cH').setAttribute('transform', `rotate(${(P.h % 12 + P.m/60)*30} 322 44)`);
      $('cM').setAttribute('transform', `rotate(${P.m*6} 322 44)`);
      $('uvBoardText').textContent = `문 비밀번호 앞자리 → ${P.front.join(' ')}`;
      $('uvSkelNum').textContent = P.back.join(' ');
      $('uvSkelLbl').textContent = '뒷자리';
    }
    document.querySelector('h1').innerHTML = `밤의 ${P.C.room} <small style="font:800 13px 'Gothic A1',sans-serif;color:#B07CFF;vertical-align:middle">${P.C.name}</small>`;
  }
  const clockStr = () => `${P.h}시 ${P.m}분`;
  const melStr = () => P.melody.map(i => NOTES[i].n).join(' · ');
  const pairStr = ([a, b]) => `${CL[ci(a)].n} + ${CL[ci(b)].n}`;

  // ---------- render helpers
  function show(id, on){ const el = $(id); if (el) el.setAttribute('display', on ? 'inline' : 'none'); }
  function render(){
    if (P.n === 1){ show('lockerOpen', S.locker); show('padlock', !S.locker); show('deskOpen', S.desk); show('uvBoard', S.uvBoard); show('uvSkel', S.uvSkel); show('doorOpen', S.escaped); }
    if (P.n === 2){ show('cabOpen', S.cab); show('cabLock', !S.cab); show('slideOn', S.scoped); show('door2Open', S.escaped); show('drip', !S.sinkKey); }
    if (P.n === 3){ show('stick', !S.stick); show('pianoLid', !S.lid); show('pianoKeys', S.lid); show('tapeIn', S.heard); show('door3Lock', !S.played); show('door3Open', S.escaped); }
    beamColor();
    const bag = $('bag'); bag.innerHTML = '';
    for (let i = 0; i < 4; i++){
      const k = S.inv[i], b = document.createElement('button');
      b.className = 'slot' + (k ? ' has' : '') + (k && S.sel === k ? ' sel' : '');
      if (k){ b.innerHTML = `${ITEMS[k].icon}<small>${ITEMS[k].name}</small>`; b.onclick = () => tapItem(k); }
      else b.disabled = true;
      bag.appendChild(b);
    }
  }
  function say(t, scary){
    const m = $('msg'); m.textContent = t; m.classList.toggle('scary', !!scary);
    m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
  }
  function give(k){ if (!S.inv.includes(k)) S.inv.push(k); }
  function take(k){ S.inv = S.inv.filter(x => x !== k); if (S.sel === k) S.sel = null; }
  function flicker(){ svg.classList.remove('flick'); void svg.offsetWidth; svg.classList.add('flick'); }
  function jumpScare(after){
    $('scare').hidden = false; stinger();
    setTimeout(() => { $('scare').hidden = true; after && after(); }, 950);
  }

  // ---------- timer (3단계: countdown — when it hits 0, "it" finds you)
  function fmt(ms){ const s = Math.max(0, Math.floor(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  function fmtKo(ms){ const s = Math.floor(ms/1000), m = Math.floor(s/60); return m ? `${m}분 ${s%60}초` : `${s%60}초`; }
  let metroOn = false;
  setInterval(() => {
    if (!S || !S.running) return;
    const el = Date.now() - S.t0;
    if (P.n === 3){ metroOn = !metroOn; $('metro').setAttribute('transform', `rotate(${metroOn ? 18 : -18} 96 146)`); }
    if (P.C.limit){
      const left = P.C.limit*1000 - el;
      $('timer').textContent = '⏳ ' + fmt(left); $('timer').style.color = left < 60000 ? '#FF6B6B' : '';
      if (left < 60000 && !S.warned){ S.warned = true; whisper(); say('…발소리가 가까워진다. 1분 남았다!', true); }
      if (left < 60000 && Math.floor(left/1000) % 2 === 0) thump();
      if (left <= 0) timeUp();
    } else { $('timer').textContent = fmt(el); $('timer').style.color = ''; }
  }, 500);
  function thump(){ try { if (!AC || muted) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 55; g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25); o.connect(g); g.connect(master); o.start(t); o.stop(t + .3); } catch(e){} }

  // ---------- random spooky events (faster in later stages)
  let spookT = null;
  const GHOST = {1:['winGhost', '창문 쪽에서 무언가 움직인 것 같다…!'], 2:['labGhost', '과학실 창문에 하얀 얼굴이 비쳤다…!'], 3:['musGhost', '초상화들의 눈이… 빨갛게 빛났다!']};
  function scheduleSpook(){
    clearTimeout(spookT);
    const [a, b] = P.C.spook;
    spookT = setTimeout(() => {
      if (!S.running || !$('ov').hidden) { scheduleSpook(); return; }
      const r = Math.random();
      if (r < 0.34){ flicker(); say('손전등이 깜빡였다… 배터리 탓이겠지?', true); }
      else if (r < 0.67){
        whisper();
        say(P.n === 3 ? '…피아노 건반 하나가 혼자 "딩—" 울렸다.' : P.n === 2 ? '…약품장 안에서 무언가 꿈틀거리는 소리가 난다.' : '…어디선가 속삭이는 소리가 들린다. "같이 놀자…"', true);
        if (P.n === 3) note(NOTES[Math.floor(Math.random()*5)].f, .8, -40);
        if (P.n === 2) bubble();
      }
      else { const [id, t] = GHOST[P.n]; show(id, true); whisper(); say(t, true); setTimeout(() => show(id, false), 1600); }
      scheduleSpook();
    }, (a + Math.random()*(b - a))*1000);
  }

  // ---------- interactions
  function tapItem(k){
    if (!S.running) return;
    if (ITEMS[k].read){ k === 'memo' ? openMemo() : openNote(); return; }
    S.sel = (S.sel === k) ? null : k;
    if (S.sel === 'uv') say('보라색 손전등을 켰다. 숨겨진 글씨가 보일지도…');
    else if (S.sel) say(`${ITEMS[k].icon} ${ITEMS[k].name}을(를) 골랐다. 쓸 곳을 눌러 보자.`);
    render();
  }

  const FLAVOR = {
    window:['달이 유난히 밝다. 창문은 녹슬어서 꿈쩍도 안 해.', '창밖은 운동장… 아무도 없다. 아무도.'],
    desks:['책상에 "뒤를 보지마"라고 새겨져 있다…', '의자 하나가 혼자 살짝 움직인 것 같다.'],
    skeleton:['과학실에 있어야 할 해골 모형이 왜 여기에…?', '해골이 나를 보고 있는 것 같다.'],
    board:['칠판에 희미하게 "나 가 지 마"라고 적혀 있다.', '분필 가루 냄새… 누가 방금 쓴 것 같다.'],
    poster:['주기율표 포스터. 누군가 "H"에 빨간 동그라미를 쳐 놨다.', '포스터 구석에 작게 "나도 실험 대상이었어"라고…'],
    stools:['실험 의자가 빙글… 혼자 돌다가 멈췄다.', '의자 위에 차가운 물기가 남아 있다.'],
    staff:['오선 칠판에 "노래해 줘…"라고 적혀 있다.', '높은음자리표가 녹아내린 것처럼 번져 있다.'],
    portraits:['음악가 초상화 셋. 눈이 나를 따라오는 것 같다…', '가운데 초상화가… 방금 웃었나?']
  };
  const fIdx = {};
  function near(e){ const p = toSvg(e); const d = Math.hypot(p.x - S.light.x, p.y - S.light.y); return {p, ok: d < R * 0.85}; }

  function tapObj(o, e){
    if (!S.running) return;
    const n = near(e);
    if (!n.ok){ setLight(n.p.x, n.p.y); return; }   // first tap just shines the light there
    ({1:tap1, 2:tap2, 3:tap3})[P.n](o, S.sel);
    render();
  }

  // ----- stage 1: classroom (unchanged chain)
  function tap1(o, sel){
    switch(o){
      case 'trash':
        if (!S.note){ S.note = true; give('note'); creak(); say('휴지통 속에 구겨진 쪽지가 있다. 📄'); render(); openNote(); return; }
        say('휴지통엔 이제 아무것도 없다.'); break;
      case 'clock': say(`시계가 ${clockStr()}에 멈춰 있다… 기분 나쁘게.`); break;
      case 'locker':
        if (S.locker){ say('13번 사물함은 텅 비었다. 다행이다…'); break; }
        openDials('🔒 13번 사물함', '자물쇠에 숫자 세 개를 맞춰야 한다.', 3, P.lockerCode, () => {
          S.locker = true; render();
          jumpScare(() => { give('deskKey'); render(); say('끼이익… 사물함 안에서 인형이 튀어나왔다!! …발밑에 교탁 열쇠가 떨어져 있다. 🔑', true); });
        });
        break;
      case 'desk':
        if (S.desk){ say('교탁 서랍은 비었다.'); break; }
        if (sel === 'deskKey'){ S.desk = true; take('deskKey'); give('uv'); creak(); say('딸깍. 교탁 서랍 안에 보라색 손전등이 있다. 🔦'); }
        else if (sel) say(`${ITEMS[sel].name}은(는) 여기에 쓸 수 없다.`);
        else say('교탁 서랍이 잠겨 있다. 작은 열쇠 구멍이 있다.');
        break;
      case 'board':
        if (sel === 'uv' && !S.uvBoard){ S.uvBoard = true; flicker(); say(`보라색 빛을 비추자 칠판에 글씨가 떠올랐다! "앞자리 → ${P.front.join(' ')}"`, true); break; }
        if (S.uvBoard){ say(`칠판의 보라색 글씨: 문 비밀번호 앞자리 → ${P.front.join(' ')}`); break; }
        flavor('board'); break;
      case 'skeleton':
        if (sel === 'uv' && !S.uvSkel){ S.uvSkel = true; stinger(); say(`해골 갈비뼈에 숫자가 빛난다… "뒷자리 ${P.back.join(' ')}"`, true); break; }
        if (S.uvSkel){ say(`해골 갈비뼈의 보라색 숫자: 뒷자리 ${P.back.join(' ')}`); break; }
        flavor('skeleton'); break;
      case 'window':
        S.windowSeen++;
        if (S.windowSeen === 2){ show('winGhost', true); stinger(); say('창문에 하얀 얼굴이…!!', true); setTimeout(() => show('winGhost', false), 1200); break; }
        flavor('window'); break;
      case 'door': openDials('🚪 교실 문', '문에 숫자 네 개짜리 잠금장치가 달려 있다.', 4, P.doorCode, escape); break;
      default: flavor(o);
    }
  }

  // ----- stage 2: science lab — sink → cabinet → jar → microscope → colour lock
  function tap2(o, sel){
    switch(o){
      case 'sink':
        if (!S.sinkKey){ S.sinkKey = true; give('cabKey'); creak(); say('똑… 똑… 배수구 안에서 뭔가 반짝인다. 손을 넣어 꺼내니… 작은 열쇠! 🗝️ (손끝이 이상하게 차갑다)', true); }
        else say('수도꼭지에서 붉은 물이 한 방울… 떨어졌다?!', true);
        break;
      case 'cabinet':
        if (!S.cab){
          if (sel === 'cabKey'){ S.cab = true; take('cabKey'); creak(); say('끼익… 약품장 유리문이 열렸다. 표본 병들이 줄지어 있다.'); render(); openJars(); return; }
          say(sel ? `${ITEMS[sel].name}은(는) 맞지 않는다.` : '약품장 유리문에 자물쇠가 걸려 있다. 안에 표본 병들이 보인다…'); break;
        }
        if (S.slide) { say('표본 병들이 나를 보고 있는 것 같다… 더는 볼일 없어.'); break; }
        openJars(); return;
      case 'microscope':
        if (S.scoped){ openMemo(); return; }
        if (sel === 'slide'){ S.scoped = true; take('slide'); give('memo'); click(); say('슬라이드를 끼우고 현미경을 들여다봤다… 아주 작은 글씨가 보인다!'); render(); openMemo(); return; }
        say(sel ? `${ITEMS[sel].name}은(는) 현미경에 쓸 수 없다.` : '현미경이다. 들여다봐도 아무것도 없다… 슬라이드가 필요해.'); break;
      case 'beakers': openMixer(); return;
      case 'model':
        S.modelPoke++;
        if (S.modelPoke === 2){ jumpScare(() => say('인체 모형의 심장이… 쿵 하고 바닥에 떨어졌다!!', true)); break; }
        say(S.modelPoke > 2 ? '인체 모형이 고개를 살짝 돌린 것 같다…' : '인체 모형이다. 반쪽 얼굴이 나를 보고 있다.', true); break;
      case 'window': flavor('window'); break;
      case 'door': openColorLock(); return;
      default: flavor(o);
    }
  }

  // ----- stage 3: music room — chairs → drum → piano → tape → player → play melody → door
  function tap3(o, sel){
    switch(o){
      case 'chairs':
        if (!S.stick){ S.stick = true; give('stick'); say('의자 밑에 북채 하나가 굴러다닌다. 🥢'); }
        else say('의자들이 전부 문 쪽을 향해 돌아가 있다…', true);
        break;
      case 'drum':

      <div class="stats"><span class="chip">⏱ ${fmtKo(ms)}</span><span class="chip">💡 힌트 ${S.hints}번</span></div>
      <p>${endings[n-1]}</p>
      <p>${isBest ? '이 단계 최고 기록이에요!' : `이 단계 최고 기록은 ${fmtKo(best.ms)}이에요.`}</p>
      <div id="joRank"></div>
      ${n < 3 ? `<button class="big" id="nextBtn">${n+1}단계 · ${STG[n].sub} ›</button>` : ''}
      <button class="${n < 3 ? 'ghost' : 'big'}" id="selBtn">단계 고르기</button>
      <a class="ghost" href="https://jangwoo-kim.github.io/games/" target="_top" style="display:block;text-align:center;text-decoration:none;color:inherit">← 메뉴로</a>`, () => {
        if (n < 3) $('nextBtn').onclick = () => startStage(n + 1);
        $('selBtn').onclick = selectScreen;
        if (window.JO) JO.mini('night', $('joRank'), {stage:n, ms, hints:S.hints, day:DKEY}, 'clear');
      }), 1400);
  }

  P = buildPuzzle(1); reset(); applyStage(); render();
  selectScreen();
})();
</script>

</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>점오하게</title>
<meta name="description" content="점심시간 5분, 게임 한 판. 설치 없이 바로 하는 미니 게임 모음.">
<meta property="og:title" content="점오하게 — 점심시간 5분 하는 게임">
<meta property="og:description" content="오늘의 탑 · 도시락 합치기 · 헥사 · 오늘의 방탈출 · 유령의 복도 · 야근 런">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Lunch-tray menu: header with a lunch clock, then two 3-up rows of game tiles. Large type for easy reading. */
:root{
  --bg:#F6F1E7; --surface:#FFFDF8; --ink:#1F1B16; --muted:#7A6F62; --line:#E6DCCB;
  --accent:#F2A93B; --accent-ink:#2A1C05; --good:#2F9E5B;
  --c-tower:#4B6BFF; --c-escape:#E0715A; --c-hall:#2B2F3A; --c-hexa:#7B4BD8; --c-lunch:#E8892B; --c-run:#1F7A46;
  --f-display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15130F; --surface:#1F1C17; --ink:#F3EDE2; --muted:#A79C8C; --line:#332E26;
  --accent:#F2A93B; --accent-ink:#2A1C05; --good:#5BD08A;
  --c-tower:#7D93FF; --c-escape:#F08A72; --c-hall:#8A93A8; --c-hexa:#A88BF0; --c-lunch:#F2A93B; --c-run:#3FBF74; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15130F; --surface:#1F1C17; --ink:#F3EDE2; --muted:#A79C8C; --line:#332E26;
  --accent:#F2A93B; --accent-ink:#2A1C05; --good:#5BD08A;
  --c-tower:#7D93FF; --c-escape:#F08A72; --c-hall:#8A93A8; --c-hexa:#A88BF0; --c-lunch:#F2A93B; --c-run:#3FBF74; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:12px;padding-block:12px 12px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.titleRow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
h1,.tag{white-space:nowrap}
h1{font-family:var(--f-display);font-weight:400;font-size:48px;line-height:.95;margin:0;letter-spacing:.01em}
h1 .five{color:var(--accent)}
.tag{margin:0;color:var(--muted);font-size:17px;font-weight:600}
.clock{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.clock.lunch i{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
section{display:flex;flex-direction:column;gap:7px}
h2{font-size:16px;letter-spacing:.04em;color:var(--muted);margin:0;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
a.tile{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 3px 8px;color:inherit;text-decoration:none;text-align:center;position:relative;overflow:hidden;transition:transform .12s ease}
a.tile:active{transform:scale(.96)}
a.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:2px}
.name{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15;word-break:keep-all;min-height:2.3em;line-height:1.1;display:flex;align-items:center;justify-content:center}
.sub{font-size:14px;color:var(--muted);line-height:1.3;min-height:2.6em;word-break:keep-all;font-weight:600}
.pill{font-size:13px;font-weight:800;border-radius:999px;padding:3px 8px;margin-top:2px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.done{background:color-mix(in srgb,var(--good) 20%,transparent)}
.meRow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.rankBtn{font-size:13px;font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:5px 12px;text-decoration:none;white-space:nowrap}
footer{color:var(--muted);font-size:14px;line-height:1.5;text-align:center;word-break:keep-all}
@media (max-width:370px){ .name{font-size:18px} .sub{font-size:13px} .pill{font-size:12px;padding:3px 6px} .thumb{width:40px;height:40px;font-size:22px} h1{font-size:42px} .clock{font-size:11px} }
</style>

<div class="wrap">
  <header>
    <div class="titleRow">
      <h1>점<span class="five">오</span>하게</h1>
      <span class="clock" id="clock"><i></i><span id="clockTxt">--:--</span></span>
    </div>
    <p class="tag">점심시간 <b>5분</b>, 하는 게임.</p>
    <div class="meRow"><span id="nick"></span><a class="rankBtn" href="https://jangwoo-kim.github.io/games/rank/" target="_top">🏆 오늘의 랭킹</a></div>
  </header>

  <section>
    <h2>매일 바뀌는 도전</h2>
    <div class="grid">
      <a class="tile" style="--c:var(--c-tower)" href="https://jangwoo-kim.github.io/games/tower/" target="_top">
        <div class="thumb">🏗️</div><div class="name">오늘의 탑</div><div class="sub">타이밍 맞춰<br>블록 쌓기</div><span class="pill" id="st-tower">⏱ 1분</span>
      </a>
      <a class="tile" style="--c:var(--c-lunch)" href="https://jangwoo-kim.github.io/games/lunch/" target="_top">
        <div class="thumb">🍱</div><div class="name">도시락 합치기</div><div class="sub">같은 음식끼리<br>합치기</div><span class="pill" id="st-lunch">⏱ 5분</span>
      </a>
      <a class="tile" style="--c:var(--c-hexa)" href="https://jangwoo-kim.github.io/games/hexa/" target="_top">
        <div class="thumb">💎</div><div class="name">헥사</div><div class="sub">보석 3개<br>맞춰서 펑!</div><span class="pill" id="st-hexa">⏱ 3~5분</span>
      </a>
    </div>
  </section>

  <section>
    <h2>탈출 · 소리 켜면 더 무서워요</h2>
    <div class="grid">
      <a class="tile" style="--c:var(--c-escape)" href="https://jangwoo-kim.github.io/games/escape/" target="_top">
        <div class="thumb">🚪</div><div class="name">오늘의 방탈출</div><div class="sub">방 4개<br>4단계 탈출</div><span class="pill" id="st-escape">⏱ 5~10분</span>
      </a>
      <a class="tile" style="--c:var(--c-hall)" href="https://jangwoo-kim.github.io/games/hall/" target="_top">
        <div class="thumb">👻</div><div class="name">유령의 복도</div><div class="sub">무궁화 꽃이<br>피었습니다</div><span class="pill" id="st-hall">⏱ 2분</span>
      </a>
      <a class="tile" style="--c:var(--c-run)" href="https://jangwoo-kim.github.io/games/run/" target="_top">
        <div class="thumb">🏃</div><div class="name">야근 런</div><div class="sub">귀신 피해<br>비상구까지</div><span class="pill" id="st-run">⏱ 1~3분</span>
      </a>
    </div>
  </section>

  <footer>설치·가입 없이 바로 플레이 · 랭킹엔 랜덤 닉네임만 올라가요</footer>
</div>

<script src="jo.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const now = new Date();
  const dkey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
  const fmtKo = ms => { const s = Math.floor(ms/1000), m = Math.floor(s/60); return m ? `${m}분 ${s%60}초` : `${s%60}초`; };
  const mark = (id, text) => { const el = $(id); el.textContent = text; el.classList.add('done'); };

  const t = get('tower:' + dkey); if (t && t.tries) mark('st-tower', `✅ ${t.best || 0}층`);
  const e = get('escape:' + dkey); if (e && e.ms) mark('st-escape', `✅ ${e.stage || 1}단계 탈출`);
  const r = get('run:' + dkey); if (r && r.dist) mark('st-run', `✅ ${r.dist.toLocaleString()}m`);
  const l = get('lunch:' + dkey); if (l && l.score) mark('st-lunch', `✅ ${l.score.toLocaleString()}점`);
  const h = get('hall5:best'); if (h && h.ms) mark('st-hall', `🏆 ${fmtKo(h.ms)}`);
  const x = get('hexa:' + dkey); if (x && x.score) mark('st-hexa', `✅ ${x.score.toLocaleString()}점`);

  function tick(){
    const d = new Date(), H = d.getHours(), M = d.getMinutes(), mins = H*60 + M;
    const el = $('clock'); let txt;
    if (mins >= 720 && mins < 780){ txt = `점심 ${60 - (mins - 720)}분 남음 🍱`; el.classList.add('lunch'); }
    else {
      el.classList.remove('lunch');
      if (mins < 720){ const left = 720 - mins; txt = `점심까지 ${left >= 60 ? Math.floor(left/60) + '시간 ' : ''}${left % 60}분`; }
      else if (H < 18) txt = '오후도 힘내요 ☕';
      else txt = '오늘도 수고했어요 🌙';
    }
    $('clockTxt').textContent = txt;
  }
  tick(); setInterval(tick, 30000);
  if (window.JO) JO.nickChip($('nick'));
})();
</script>

</html>
